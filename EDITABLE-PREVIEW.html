(()=>{

 let admin=false;
 function load(){try{return JSON.parse(localStorage.getItem(key))||{sales:[],admin:{expenses:[],team:[]}}}catch{return {sales:[],admin:{expenses:[],team:[]}}}}
 function save(data){localStorage.setItem(key,JSON.stringify(data))}
 const reply=(data,status=200)=>Promise.resolve(new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}}));

     data.sales.unshift({...body,items:JSON.stringify(body.items),cups:body.items.reduce((a,n)=>a+n,0),total:body.items.reduce((a,n,i)=>a+n*([60,60,70][i]-body.discount),0),created_at:new Date().toISOString(),voided:0});save(data);
    }
    return reply({ok:true});
   }
   return reply(data.sales.filter(s=>!s.voided));
  }
  if(url==='/api/void'){
   if(!admin)return reply({error:'Unlock Admin first'},401);
   data.sales=data.sales.map(s=>s.id===body.id?{...s,voided:1}:s);save(data);return reply({ok:true});
  }

 };

function setSellerOptions(){const select=$('seller'),previous=pending?.seller||select.value||localStorage.getItem('lemon-seller')||names[0];const choices=[...names];if(pending&&!choices.includes(previous))choices.push(previous);select.innerHTML=choices.map(n=>'<option>'+safe(n)+'</option>').join('');select.value=choices.includes(previous)?previous:choices[0]}

function renderCart(){
 const cups=cart.reduce((a,n)=>a+n,0),total=cart.reduce((a,n,i)=>a+n*(drinks[i][1]-off),0),locked=busy||!!pending;
 cart.forEach((n,i)=>{$('qty'+i).textContent=n;$('unit'+i).textContent=money(drinks[i][1]-off);$('flavour'+i).classList.toggle('selected',n>0)});

 $('discount0').classList.toggle('selected',off===0);$('discount10').classList.toggle('selected',off===10);
 $('sale-fields').querySelectorAll('button,select').forEach(b=>b.disabled=locked);

function add(i,n){if(busy||pending)return;cart[i]=Math.max(0,Math.min(100,cart[i]+n));renderCart()}

function day(value){return new Date(value).toLocaleDateString('en-CA',{timeZone:'Indian/Maldives'})}
function byPeriod(period){return period==='all'?sales:sales.filter(s=>day(s.created_at)===day(new Date()))}
function tally(list){return [...new Set([...names,...list.map(s=>s.seller)])].map(name=>({name,cups:list.filter(s=>s.seller===name).reduce((a,s)=>a+s.cups,0),total:list.filter(s=>s.seller===name).reduce((a,s)=>a+s.total,0)})).sort((a,b)=>b.cups-a.cups||a.name.localeCompare(b.name))}

async function sync(){if(syncing)return;syncing=true;try{
 const tr=await fetch('/api/team');if(tr.ok){const team=await tr.json();if(Array.isArray(team)&&team.length&&team.every(n=>typeof n==='string')&&JSON.stringify(team)!==JSON.stringify(names)){names=team;setSellerOptions()}}

 renderHistory();if(currentView==='board')renderBoard();if(adminOpen&&['overview','sales'].includes(adminPage))renderAdmin();
}catch{$('sync').textContent='Offline';$('sync').classList.add('offline')}finally{syncing=false}}
async function checkout(payment){
 if(busy||!cart.some(Boolean)||(pending&&pending.payment!==payment))return;
 pending=pending||{id:crypto.randomUUID(),seller:$('seller').value,items:[...cart],discount:off,payment};
 try{localStorage.setItem(pendingKey,JSON.stringify(pending))}catch{}busy=true;$('sale-error').textContent='';renderCart();
 try{const response=await fetch('/api/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)});if(!response.ok)throw Error();
 pending=null;try{localStorage.removeItem(pendingKey)}catch{}cart=[0,0,0];off=0;$('sale-dialog').close();document.body.classList.remove('sale-open');toast('Sale recorded ✓');if(window.celebrateSale)window.celebrateSale();await sync();
 }catch{$('sale-error').textContent='Sale not confirmed. Retry the same payment. Your order is kept.'}finally{busy=false;renderCart()}
}

 }
 if(adminPage==='team'){
  out='<div class="admin-toolbar"><div><b>'+adminData.team.length+' team members</b><small>Choose who can record sales.</small></div>'+save+'</div><form class="panel team-add" onsubmit="addTeamMember(event)"><label for="new-member">New team member</label><div><input id="new-member" maxlength="50" placeholder="Name" autocomplete="off" required><button class="smallbtn primary" type="submit">Add member</button></div><p id="team-error" role="alert"></p></form><div class="panel team-list">'+adminData.team.map((x,i)=>'<div class="team-row"><span class="team-avatar" aria-hidden="true">'+safe(x.name.charAt(0))+'</span><b>'+safe(x.name)+'</b><button class="smallbtn danger" '+(adminData.team.length<=1?'disabled':'')+' onclick="removeTeamMember('+i+')" aria-label="Remove '+safe(x.name)+'">Remove</button></div>').join('')+'</div><p class="admin-note">Removing a member keeps their past sales and rankings. Keep at least one active seller.</p>';

function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false,closed=false;
 text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else cell+=c;continue}if(c==='"'){if(cell.trim()||closed)throw Error('Unexpected quote in CSV.');quoted=true;cell='';continue}if(c===','||c==='\n'||c==='\r'){row.push(cell);cell='';closed=false;if(c!==','){if(c==='\r'&&text[i+1]==='\n')i++;if(row.some(v=>v.trim()))rows.push(row);row=[]}continue}if(closed&&c.trim())throw Error('Invalid text after CSV quote.');if(!closed)cell+=c}
 if(quoted)throw Error('Unclosed quote in CSV.');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows;
}
function expensesFromCSV(text){const rows=parseCSV(text);if(rows.length<2)throw Error('CSV needs a header and at least one expense.');const aliases={name:['name','item','description','expense'],category:['category'],vendor:['vendor','supplier'],qty:['qty','quantity'],amount:['amount','mvr','cost','total','amountmvr','totalmvr']};const headers=rows.shift().map(h=>h.toLowerCase().replace(/[^a-z]/g,'')),cols={};for(const k in aliases)cols[k]=headers.findIndex(h=>aliases[k].includes(h));if(cols.name<0||cols.amount<0)throw Error('Include Name and Amount columns.');if(rows.length>200)throw Error('Maximum 200 expense rows.');return rows.map((r,i)=>{const get=k=>cols[k]<0?'':String(r[cols[k]]??'').trim(),raw=get('amount').replace(/^MVR\s*/i,'').replace(/,/g,'').trim();if(!get('name')||!raw||!/^\d+(\.\d{1,2})?$/.test(raw))throw Error('Check item name and amount on row '+(i+2)+'.');const amount=Number(raw);if(!Number.isFinite(amount)||amount<0)throw Error('Invalid amount on row '+(i+2)+'.');return {name:get('name'),category:get('category'),vendor:get('vendor'),qty:get('qty'),amount}})}
function expenseSignature(x){return JSON.stringify([x.name,x.category||'',x.vendor||'',String(x.qty||''),x.amount])}
function prepareExpenseImport(text){const incoming=expensesFromCSV(text),seen=new Set(adminData.expenses.map(expenseSignature)),rows=[];let duplicates=0;for(const x of incoming){const sig=expenseSignature(x);if(seen.has(sig)){duplicates++;continue}seen.add(sig);rows.push(x)}if(adminData.expenses.length+rows.length>200)throw Error('Import would exceed the 200-row limit.');expenseImport={rows,duplicates};return expenseImport}
async function readExpenseCSV(input){if(adminSaving)return;const file=input.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error('Use a CSV smaller than 1 MB.');prepareExpenseImport(await file.text());if(adminPage==='expenses')renderAdmin();else toast('Expense import ready in Expenses.')}catch(e){expenseImport=null;if($('import-preview'))$('import-preview').textContent=e.message;else toast(e.message)}input.value=''}

document.addEventListener('DOMContentLoaded',()=>{
if(!window.lottie)return;
(()=>{
 const instances=new Map(),reduce=matchMedia('(prefers-reduced-motion: reduce)');
 function create(el,name,loop=false){
  if(!window.lottie||!el)return null;
  el.textContent='';
  const instance=lottie.loadAnimation({container:el,renderer:'svg',loop:reduce.matches?false:loop,autoplay:!reduce.matches,animationData:JSON.parse(JSON.stringify(window.LEMONADE_ANIMATIONS[name])),rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});
  instance.addEventListener('DOMLoaded',()=>{if(reduce.matches)instance.goToAndStop(Math.max(0,instance.totalFrames-1),true)});
  return instance;
 }
 window.refreshMotions=()=>{
  for(const [el,a] of instances)if(!el.isConnected){a.destroy();instances.delete(el)}
  document.querySelectorAll('[data-motion]').forEach(el=>{if(instances.has(el)||el.closest('.hidden'))return;let loop=Number(el.dataset.motionLoop)||false;const a=create(el,el.dataset.motion,loop);if(a)instances.set(el,a)});
 };
 window.replayMotionIn=root=>{refreshMotions();for(const [el,a] of instances)if(root.contains(el)&&!reduce.matches)a.goToAndPlay(0,true)};
 let saleInstance,timer;
 window.celebrateSale=()=>{
  if(reduce.matches)return;
  const el=document.getElementById('sale-motion');if(!el)return;
  clearTimeout(timer);if(saleInstance)saleInstance.destroy();el.classList.remove('hidden');saleInstance=create(el,'sweet-sale');timer=setTimeout(()=>{el.classList.add('hidden');saleInstance?.destroy();saleInstance=null},2100);
 };
 const observer=new MutationObserver(()=>refreshMotions());
 // Only observe app re-renders, never the SVG subtrees animated every frame.
 ['ticket','podium'].forEach(id=>{const el=document.getElementById(id);if(el)observer.observe(el,{childList:true})});
 refreshMotions();
 reduce.addEventListener('change',()=>{for(const a of instances.values()){if(reduce.matches)a.goToAndStop(Math.max(0,a.totalFrames-1),true)}});
})();

});
